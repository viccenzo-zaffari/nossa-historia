name: Anniversary Reminders

on:
  schedule:
    # Roda todo dia às 08:00 BRT (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary resend python-dotenv

      - name: Run anniversary reminder script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python scripts/anniversary_reminder.py
